name: Test Blusic youtubei.js relay
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['relay/**', '.github/workflows/relay.yml', 'render.yaml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: relay
      - run: npm test
        working-directory: relay
