name: Build and test Soryn iOS
run-name: Soryn IPA ${{ inputs.request_id || github.run_number }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifiant de la demande Windows (laisser vide pour un lancement manuel)
        type: string
        required: false
  push:
    branches: [main, master]
    paths:
      - 'Blusic/**'
      - 'BlusicTests/**'
      - 'Blusic.xcodeproj/**'
      - '.github/workflows/ios.yml'
      - 'tools/check_project.py'
      - 'tools/capture_simulator.py'
      - 'tools/select_simulator.py'
      - 'tools/package_ipa.py'
      - 'tools/verify_ipa.py'
      - 'tools/configure_ios_relay.py'
      - 'tools/run_ios_test_group.py'
      - 'tools/test_ios_test_groups.py'
      - 'native-resolver/**'
      - 'relay/audio-quality.mjs'
      - 'windows/core/**'
      - 'windows/test/ios-server.mjs'
      - 'account-server/**'
  pull_request:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-resolver/package-lock.json
      - name: Build packaged youtubei.js SABR resolver
        working-directory: native-resolver
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run build
      - name: Verify host-native Opus CAF decoder
        run: swift tools/check_opus_caf.swift BlusicTests/opus-vbr.caf
      - name: Configure bundled youtubei.js relay
        env:
          BLUSIC_IOS_RELAY_URL: ${{ vars.BLUSIC_IOS_RELAY_URL }}
          BLUSIC_IOS_RELAY_ACCESS: ${{ secrets.BLUSIC_IOS_RELAY_ACCESS }}
          BLUSIC_IOS_RELAY_EXPIRES: ${{ vars.BLUSIC_IOS_RELAY_EXPIRES }}
          BLUSIC_IOS_RELAY_REVISION: ${{ vars.BLUSIC_IOS_RELAY_REVISION }}
        run: python3 tools/configure_ios_relay.py
      - name: Build for physical iPhone (unsigned)
        run: >-
          xcodebuild build -project Blusic.xcodeproj -scheme Blusic -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build/Device
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - name: Package and verify real iPhone IPA
        run: >-
          python3 tools/package_ipa.py
          --app build/Device/Build/Products/Release-iphoneos/Blusic.app
          --output build/Blusic-unsigned.ipa
      - name: Verify preconfigured youtubei.js in compiled IPA
        run: python3 tools/verify_ipa.py build/Blusic-unsigned.ipa --require-youtubei
      - uses: actions/upload-artifact@v4
        with:
          name: Blusic-iPhone-unsigned-needs-signing
          path: build/Blusic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Select compatible iPhone simulator
        run: python3 tools/select_simulator.py >> "$GITHUB_ENV"
      - name: Boot iPhone simulator
        id: simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Start encrypted Windows protocol fixture for iPhone tests
        run: node windows/test/ios-server.mjs > build/soryn-sync-node.log 2>&1 &
      - name: Install account interoperability test dependencies
        working-directory: account-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start optional account PostgreSQL test fixture
        run: node account-server/test/ios-server.mjs > build/soryn-accounts-node.log 2>&1 &
      - name: Real PCM reactive background and safe tap lifecycle
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/SorynReactiveBackgroundTests.xcresult
          -only-testing:BlusicTests/BlusicTests/testReactiveBackgroundMeasuresRealBassAndLeavesPCMUnchanged
          -only-testing:BlusicTests/BlusicTests/testReactiveBackgroundSilenceStaleFramesAndResetDoNotInventBeats
          -only-testing:BlusicTests/BlusicTests/testReactiveBackgroundIntensityAccessibilityAndLegacySettings
          -only-testing:BlusicTests/BlusicTests/testReactiveBackgroundNativeOpusTapFollowsPlaybackAndDetachesSafely
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export reactive background results
        if: ${{ !cancelled() && hashFiles('build/SorynReactiveBackgroundTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/SorynReactiveBackgroundTests.xcresult > build/soryn-reactive-background-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soryn-reactive-background-tests
          path: |
            build/SorynReactiveBackgroundTests.xcresult
            build/soryn-reactive-background-summary.json
          retention-days: 7
      - name: Personalized radio and analyzed AutoMix native playback
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/SorynRadioAutoMixTests.xcresult
          -only-testing:BlusicTests/BlusicTests/testRadioRankingUsesTasteDeduplicatesAndRespectsDislikes
          -only-testing:BlusicTests/BlusicTests/testRadioCatalogRequestsAudioRadioAndRejectsMusicVideos
          -only-testing:BlusicTests/BlusicTests/testRadioRefillsWithoutRepeatingAndStopsWithoutChangingPlayback
          -only-testing:BlusicTests/BlusicTests/testRadioOfflineModeNeverCallsCatalogAndDislikesPersistLocally
          -only-testing:BlusicTests/BlusicTests/testStoppingRadioCancelsLateRecommendationsAndKeepsManualQueue
          -only-testing:BlusicTests/BlusicTests/testAutoMixEstimatesPulseTempoButDoesNotInventBeatsForSilence
          -only-testing:BlusicTests/BlusicTests/testAutoMixPlannerBoundsTempoBeatAlignmentAndSafeFallback
          -only-testing:BlusicTests/BlusicTests/testAutoMixNativeAnalysisCacheAndOriginalBytesRemainIntact
          -only-testing:BlusicTests/BlusicTests/testAutoMixActuallyOverlapsPreparedNativeTracksAndPauseStopsBoth
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export radio and AutoMix results
        if: ${{ !cancelled() && hashFiles('build/SorynRadioAutoMixTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/SorynRadioAutoMixTests.xcresult > build/soryn-radio-automix-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soryn-radio-automix-tests
          path: |
            build/SorynRadioAutoMixTests.xcresult
            build/soryn-radio-automix-summary.json
          retention-days: 7
      - name: Native loudness normalization, gain safety and unchanged audio
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/SorynNormalizationTests.xcresult
          -only-testing:BlusicTests/BlusicTests/testNormalizationKWeightingMatchesReferenceAt44100And48000Hz
          -only-testing:BlusicTests/BlusicTests/testNormalizationGatesSilenceAndMatchesQuietAndLoudTracks
          -only-testing:BlusicTests/BlusicTests/testNormalizationGainRespectsPeakHeadroomAndBoostLimit
          -only-testing:BlusicTests/BlusicTests/testNormalizationNativeGainStageActuallyRendersAtTheTargetLoudness
          -only-testing:BlusicTests/BlusicTests/testNormalizationCacheInvalidatesChangedFilesAndNeverRewritesAudio
          -only-testing:BlusicTests/BlusicTests/testNormalizationOpusOfflinePlaybackSeekAndDisablePreserveTheSource
          -only-testing:BlusicTests/BlusicTests/testNormalizationPreparesAProgressiveAACBeforeNativePlayback
          -only-testing:BlusicTests/BlusicTests/testCrossfadeOverlapsTwoNativeDecksAndFinishes
          -only-testing:BlusicTests/BlusicTests/testPauseStopsBothCrossfadeDecks
          -only-testing:BlusicTests/BlusicTests/testCancelledResolverJobCannotDiscardTheNextJobsAudio
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export normalization test summary
        if: ${{ !cancelled() && hashFiles('build/SorynNormalizationTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/SorynNormalizationTests.xcresult > build/soryn-normalization-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soryn-iPhone-audio-normalization-tests
          path: |
            build/soryn-normalization-summary.json
            build/SorynNormalizationTests.xcresult
          retention-days: 7
      - name: Native iPhone Opus decode, seek, bridge and offline persistence
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/SorynOpusTests.xcresult
          -only-testing:BlusicTests/BlusicTests/testOpusCAFNativeDecodeSeekAndMeasuredDuration
          -only-testing:BlusicTests/BlusicTests/testOpusSpoolNativeCodecAndQualitySeparation
          -only-testing:BlusicTests/BlusicTests/testOpusOfflineFileSurvivesRestartWithoutLosingAACDownload
          -only-testing:BlusicTests/BlusicTests/testOpusSettingPersistsWithoutChangingLegacyAACPreference
          -only-testing:BlusicTests/BlusicTests/testOpusOfflineNativePlaybackAndSeekNeverCallsTheNetwork
          -only-testing:BlusicTests/BlusicTests/testOpusPacketIdentitySurvivesSpoolCacheDownloadAndRestartRepeatedly
          -only-testing:BlusicTests/BlusicTests/testOpusLabelCannotTurnAACOrPCMIntoAnOpusDownload
          -only-testing:BlusicTests/BlusicTests/testOfflineAuditFindsMissingAndCorruptVariantsWithoutDeletingGoodAAC
          -only-testing:BlusicTests/BlusicTests/testInterruptedDownloadQueueWaitsForConsentAndKeepsRequestedQuality
          -only-testing:BlusicTests/BlusicTests/testRetryAllFailuresAndImmediateCancelThenRetryCannotLoseTheNewJob
          -only-testing:BlusicTests/BlusicTests/testOfflineOnlyPlaybackRejectsNetworkResolutionAndPrefetch
          -only-testing:BlusicTests/BlusicTests/testPlaylistDownloadsContinueAfterOneFailureAndDoNotDownloadDuplicates
          -only-testing:BlusicTests/BlusicTests/testCancellingAnOfflineDownloadDoesNotLeaveACompletedEntry
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export offline and Opus regression summary
        if: ${{ !cancelled() && hashFiles('build/SorynOpusTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/SorynOpusTests.xcresult > build/soryn-opus-summary.json
      - name: Real-network on-device original Opus (no AAC fallback)
        continue-on-error: true
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/SorynOpusNetworkTests.xcresult
          -only-testing:BlusicTests/BlusicTests/testLiveOpusOriginalResolvesOnDeviceAndDecodesTheWholeSong
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Verify actual iPhone to Windows encrypted pairing and merge
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/SorynSyncTests.xcresult
          -only-testing:BlusicTests/BlusicTests/testSorynAuthenticatedEncryptionRejectsTamperingAndWrongKey
          -only-testing:BlusicTests/BlusicTests/testSorynEncryptedWindowsProtocolAgainstNodeServer
          -only-testing:BlusicTests/BlusicTests/testSorynMergePreservesPersonalFilesSettingsAndConcurrentEdits
          -only-testing:BlusicTests/BlusicTests/testSorynPairingRejectsPublicAddressesAndInvalidKeys
          -only-testing:BlusicTests/BlusicTests/testSorynPairedClientSyncsFavoritesAndRemovalsAgainstNode
          -only-testing:BlusicTests/BlusicTests/testSorynOptionalAccountTwoDevicesAndLocalPreservation
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export Soryn pairing test summary
        if: ${{ !cancelled() && hashFiles('build/SorynSyncTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/SorynSyncTests.xcresult > build/soryn-sync-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soryn-iPhone-Windows-sync-tests
          path: |
            build/soryn-sync-summary.json
            build/soryn-sync-node.log
            build/soryn-accounts-node.log
            build/SorynSyncTests.xcresult
            build/SorynOpusTests.xcresult
            build/soryn-opus-summary.json
            build/SorynOpusNetworkTests.xcresult
          retention-days: 7
      - name: Unit tests on iPhone simulator
        id: iphone-tests
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: python3 tools/run_ios_test_group.py --group deterministic
      - name: Export test summary
        if: ${{ !cancelled() && hashFiles('build/BlusicTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/BlusicTests.xcresult > build/test-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blusic-test-results
          path: |
            build/BlusicTests.xcresult
            build/test-summary.json
          retention-days: 7
      - name: Other real-network probes (reported separately, never substituted for deterministic tests)
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        continue-on-error: true
        run: python3 tools/run_ios_test_group.py --group network --exclude testLiveOpusOriginalResolvesOnDeviceAndDecodesTheWholeSong
      - name: Export independent network results
        if: ${{ !cancelled() && hashFiles('build/SorynNetworkTests.xcresult/Info.plist') != '' }}
        run: xcrun xcresulttool get test-results summary --path build/SorynNetworkTests.xcresult > build/network-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soryn-independent-network-tests
          path: |
            build/SorynNetworkTests.xcresult
            build/network-summary.json
          retention-days: 7
      - name: Capture native layouts on large and compact iPhones
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 7
        run: >-
          python3 tools/capture_simulator.py --device "$SIMULATOR_ID"
          --app build/DerivedData/Build/Products/Debug-iphonesimulator/Blusic.app
          --output build/screenshots
          --focus-audio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blusic-iPhone-screenshots
          path: build/screenshots
          retention-days: 7
