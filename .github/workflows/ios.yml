name: Build and test Soryn iOS
run-name: Soryn IPA ${{ inputs.request_id || github.run_number }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifiant de la demande Windows (laisser vide pour un lancement manuel)
        type: string
        required: false
  push:
    branches: [main, master]
    paths:
      - 'Blusic/**'
      - 'BlusicTests/**'
      - 'Blusic.xcodeproj/**'
      - '.github/workflows/ios.yml'
      - 'tools/check_project.py'
      - 'tools/capture_simulator.py'
      - 'tools/select_simulator.py'
      - 'tools/package_ipa.py'
      - 'tools/verify_ipa.py'
      - 'tools/configure_ios_relay.py'
      - 'native-resolver/**'
      - 'relay/audio-quality.mjs'
      - 'windows/core/**'
      - 'windows/test/ios-server.mjs'
  pull_request:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-resolver/package-lock.json
      - name: Build packaged youtubei.js SABR resolver
        working-directory: native-resolver
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Configure bundled youtubei.js relay
        env:
          BLUSIC_IOS_RELAY_URL: ${{ vars.BLUSIC_IOS_RELAY_URL }}
          BLUSIC_IOS_RELAY_ACCESS: ${{ secrets.BLUSIC_IOS_RELAY_ACCESS }}
          BLUSIC_IOS_RELAY_EXPIRES: ${{ vars.BLUSIC_IOS_RELAY_EXPIRES }}
          BLUSIC_IOS_RELAY_REVISION: ${{ vars.BLUSIC_IOS_RELAY_REVISION }}
        run: python3 tools/configure_ios_relay.py
      - name: Build for physical iPhone (unsigned)
        run: >-
          xcodebuild build -project Blusic.xcodeproj -scheme Blusic -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build/Device
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - name: Package and verify real iPhone IPA
        run: >-
          python3 tools/package_ipa.py
          --app build/Device/Build/Products/Release-iphoneos/Blusic.app
          --output build/Blusic-unsigned.ipa
      - name: Verify preconfigured youtubei.js in compiled IPA
        run: python3 tools/verify_ipa.py build/Blusic-unsigned.ipa --require-youtubei
      - uses: actions/upload-artifact@v4
        with:
          name: Blusic-iPhone-unsigned-needs-signing
          path: build/Blusic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Select compatible iPhone simulator
        run: python3 tools/select_simulator.py >> "$GITHUB_ENV"
      - name: Boot iPhone simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Start encrypted Windows protocol fixture for iPhone tests
        run: node windows/test/ios-server.mjs > build/soryn-sync-node.log 2>&1 &
      - name: Unit tests on iPhone simulator
        id: iphone-tests
        run: >-
          xcodebuild test -project Blusic.xcodeproj -scheme Blusic
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData -resultBundlePath build/BlusicTests.xcresult
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export test summary
        if: always()
        run: xcrun xcresulttool get test-results summary --path build/BlusicTests.xcresult > build/test-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blusic-test-results
          path: |
            build/BlusicTests.xcresult
            build/test-summary.json
          retention-days: 7
      - name: Capture native layouts on large and compact iPhones
        if: always()
        timeout-minutes: 7
        run: >-
          python3 tools/capture_simulator.py --device "$SIMULATOR_ID"
          --app build/DerivedData/Build/Products/Debug-iphonesimulator/Blusic.app
          --output build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Blusic-iPhone-screenshots
          path: build/screenshots
          retention-days: 7
